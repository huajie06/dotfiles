set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g set-titles on
set -g display-time 3000
set -g display-panes-time 3000
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0

setw -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind -T prefix F12 set-option -g prefix None \; set prefix None \; display "Prefix disabled"

set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 100

set -g status-fg white
set -g status-bg colour235

set -g status-left "#[fg=colour235,bg=colour214] #S #[fg=colour214,bg=colour235] "
set -g status-right "#[fg=colour214,bg=colour235] %Y-%m-%d %H:%M #[fg=colour235,bg=colour214] #H "

setw -g window-status-format " #I: #W "
setw -g window-status-current-format "#[fg=colour235,bg=colour214] #I: #W #[fg=colour214,bg=colour235] "
setw -g window-status-separator ""
setw -g window-status-current-style "fg=colour235,bg=colour214"
setw -g window-status-style "fg=colour250,bg=colour235"
setw -g window-status-activity-style "fg=colour214,bg=colour235"
setw -g window-status-bell-style "fg=colour235,bg=colour196"
